[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'ar'
strip = 'strip'

[host_machine]
system = 'darwin'
subsystem = 'ios'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[properties]
needs_exe_wrapper = true
target_ios = true

[built-in options]
c_args = ['-mios-version-min=14.0']
c_link_args = ['-mios-version-min=14.0']
